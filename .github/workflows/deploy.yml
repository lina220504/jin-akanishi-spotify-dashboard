name: ビルドとデプロイ

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜日 0:00 UTC (日本時間 月曜9:00)
  workflow_dispatch: # 手動実行

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: バックエンドの依存関係をインストール
        run: |
          cd backend
          npm install

      - name: Spotifyデータを取得
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ARTIST_ID: '3Z3TqPXlrrRdm7IP3pQXjw'
        run: |
          cd backend
          node fetch-spotify-data.js

      - name: データを分析
        run: |
          cd backend
          node analyze-data.js

      - name: フロントエンドの依存関係をインストール
        run: |
          cd frontend
          npm install

      - name: データをフロントエンドにコピー
        run: |
          mkdir -p frontend/public/data
          cp data/latest.json frontend/public/data/
          cp data/analysis.json frontend/public/data/

      - name: フロントエンドをビルド
        run: |
          cd frontend
          npm run build

      - name: GitHub Pagesにデプロイ
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

      - name: データの変更をコミット
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 データ更新 $(date +'%Y-%m-%d')"

      - name: 変更をプッシュ
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
